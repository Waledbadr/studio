name = "estatecare-cloudflare"
compatibility_date = "2024-08-26"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "out"

# متغيرات البيئة العامة
[vars]
NODE_ENV = "production"
NEXT_PUBLIC_APP_URL = "https://estatecare-cloudflare.pages.dev"

# إعدادات محلية لحل مشكلة process
[env.development]
compatibility_flags = ["nodejs_compat"]
vars = { NODE_ENV = "development" }

# قاعدة بيانات D1
[[d1_databases]]
binding = "DB"
database_name = "estatecare-db"
database_id = "802520b7-431f-40c7-8399-3ed056744e89"

# KV Storage للتخزين السريع والـ caching
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id"  # سيتم استبداله بالـ ID الفعلي
preview_id = "your-kv-preview-id"

# R2 Storage للملفات
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "estatecare-files"
preview_bucket_name = "estatecare-files-preview"

# إعدادات بيئة الإنتاج
[env.production]
vars = { NODE_ENV = "production" }

# إعدادات بيئة التطوير
[env.preview]
vars = { NODE_ENV = "development" }

# إعدادات Pages Functions - إزالة build section لأنها ستتم معالجتها تلقائياً

# التوافق مع Node.js APIs تم نقله للأعلى
